
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>غرفة الذكاء الاصطناعي | AI Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="غرفة الذكاء الاصطناعي">
        <span class="brand-mark">✦</span>
        <span data-i18n="brand">غرفة الذكاء الاصطناعي</span>
      </a>

      <div class="top-actions">
        <button class="utility-btn" id="soundToggle" type="button" aria-pressed="false">
          <span id="soundIcon">♫</span>
          <span data-i18n="sound">الصوت</span>
        </button>
        <button class="utility-btn" id="langToggle" type="button">EN</button>
      </div>
    </header>

    <main>
      <section class="room-stage" aria-label="Interactive AI room">
        <div class="room-glow"></div>
        <div class="room-grid"></div>

        <div class="room-back-wall">
          <div class="wall-line wall-line-one"></div>
          <div class="wall-line wall-line-two"></div>

          <div class="portal">
            <div class="portal-ring ring-one"></div>
            <div class="portal-ring ring-two"></div>
            <div class="portal-core">AI</div>
            <span class="portal-label" data-i18n="portalLabel">
              من الفضول تبدأ الحكاية
            </span>
          </div>
        </div>

        <div class="floor"></div>

        <div class="room-heading">
          <p class="eyebrow" data-i18n="eyebrow">
            مساحة تفاعلية للاستكشاف
          </p>

          <h1 data-i18n="headline">
            أهلًا بكِ في<br>
            <span>غرفة الذكاء الاصطناعي</span>
          </h1>

          <p class="room-instruction" data-i18n="instruction">
            انقري على العناصر المضيئة واكتشفي ما وراءها
          </p>
        </div>

        <button class="room-object object-brain" data-topic="brain" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">🧠</span>
          <span class="object-name" data-i18n="brainLabel">العقل الذكي</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <button class="room-object object-art" data-topic="art" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">🎨</span>
          <span class="object-name" data-i18n="artLabel">مرسم الخيال</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <button class="room-object object-voice" data-topic="voice" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">🎙️</span>
          <span class="object-name" data-i18n="voiceLabel">بوابة الصوت</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <button class="room-object object-vision" data-topic="vision" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">👁️</span>
          <span class="object-name" data-i18n="visionLabel">عين الآلة</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <button class="room-object object-fact" data-topic="fact" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">💡</span>
          <span class="object-name" data-i18n="factLabel">شرارة فضول</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <button class="room-object object-project" data-topic="project" type="button">
          <span class="object-halo"></span>
          <span class="object-icon">🛠️</span>
          <span class="object-name" data-i18n="projectLabel">ورشة الإنجاز</span>
          <span class="object-prompt" data-i18n="click">اضغطي للاستكشاف</span>
        </button>

        <div class="room-footer">
          <span data-i18n="footer">تجربة تعليمية تفاعلية</span>
          <span class="footer-dot">✦</span>
          <span>AI • Explore • Create</span>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <section class="info-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">
          ×
        </button>

        <div class="modal-symbol" id="modalSymbol">✦</div>
        <p class="modal-kicker" data-i18n="discovery">اكتشاف جديد</p>
        <h2 id="modalTitle">عنوان</h2>
        <div class="modal-body" id="modalBody"></div>

        <div class="modal-bottom">
          <span class="modal-progress"><span></span></span>
          <button class="modal-done" id="modalDone" type="button" data-i18n="back">
            العودة إلى الغرفة
          </button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
